<!doctype html>
<html lang="en-NZ">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ac57c0">
  <meta name="description" content="Adicta is a mindful and deliberate honouring of the tortilla, the planet and the women creating it. Traditionally honored techniques, sustainable practices, and local ingredients.">
  <title>Adicta</title>
  <link rel="canonical" href="https://maxwoodworks.github.io/adicta/">
  <link rel="icon" href="./assets/adicta-emblem.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./styles.css?v=20261009-final">
  <script src="./script.js?v=20261009-final" defer></script>

<body>
  <main class="page" id="main-content">
    <div class="composition">
      <div class="copy-column">
        <section class="chapter" aria-labelledby="manifesto-title">
          <h1 class="wordmark" id="manifesto-title">
            <span class="visually-hidden">Adicta,</span>
            <img src="./assets/adicta-wordmark.svg?v=20261009-final" width="128" height="66" alt="" aria-hidden="true">
          </h1>
          <p class="copy-art manifesto">
            <span class="visually-hidden">Adicta is a mindful and deliberate honouring of the tortilla, the planet and the women creating it.</span>
            <img src="./assets/manifesto.svg?v=20261009-final" width="320" height="173" alt="" aria-hidden="true">
          </p>
        </section>
        <section class="chapter" aria-labelledby="story-title">
          <h2 class="wordmark" id="story-title">
            <span class="visually-hidden">Adicta,</span>
            <img src="./assets/adicta-wordmark.svg?v=20261009-final" width="128" height="66" alt="" aria-hidden="true">
          </h2>
          <p class="copy-art story">
            <span class="visually-hidden">Adicta dignifies a confident service to real food, with traditionally honored techniques, sustainable practices, made simple with local ingredients.</span>
            <img src="./assets/story.svg?v=20261009-final" width="310" height="232" alt="" aria-hidden="true">
          </p>
        </section>
      </div>
      <div class="corn-column">
        <p class="corn-caption corn-caption-top">
          <img src="./assets/all-natural.svg" width="102" height="33" alt="All Natural">
        </p>
        <button class="corn-button" type="button" aria-label="Invert page colours" aria-pressed="false">
          <span class="corn-drift">
            <img class="corn" src="./assets/corn.svg" width="139" height="390" alt="" aria-hidden="true" draggable="false">

        </button>
        <p class="corn-caption corn-caption-bottom">
          <img src="./assets/made-in-aotearoa.svg" width="162" height="33" alt="Made in Aotearoa">
        </p>
      </div>
      <div class="emblems" aria-hidden="true">
        <img src="./assets/adicta-emblem.svg" width="414" height="401" alt="" draggable="false">
        <img src="./assets/adicta-emblem.svg" width="414" height="401" alt="" draggable="false">
        <img src="./assets/adicta-emblem.svg" width="414" height="401" alt="" draggable="false">
